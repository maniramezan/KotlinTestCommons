org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

GROUP=io.github.maniramezan.testcommons
# The published version is not defined here. Release automation injects VERSION_NAME from the
# computed SemVer tag, and non-release builds fall back to 0.0.0-SNAPSHOT in build.gradle.kts.

POM_NAME=KotlinTestCommons
POM_DESCRIPTION=Shared test helpers for Kotlin, Android, and Compose Multiplatform: dependency spies, scripted fakes, a manual clock, async observation, layout geometry, Compose UI test helpers, and Espresso/UiAutomator helpers.
POM_INCEPTION_YEAR=2026
POM_URL=https://github.com/maniramezan/KotlinTestCommons
POM_LICENSE_NAME=MIT License
POM_LICENSE_URL=https://opensource.org/licenses/MIT
POM_LICENSE_DIST=repo
POM_SCM_URL=https://github.com/maniramezan/KotlinTestCommons
POM_SCM_CONNECTION=scm:git:git://github.com/maniramezan/KotlinTestCommons.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/maniramezan/KotlinTestCommons.git
POM_DEVELOPER_ID=maniramezan
POM_DEVELOPER_NAME=Mani Ramezan
POM_DEVELOPER_URL=https://github.com/maniramezan

SONATYPE_HOST=CENTRAL_PORTAL
RELEASE_SIGNING_ENABLED=true
