version: 2
# Every version update across ecosystems and directories lands in one weekly pull request.
# Security updates stay disabled so they cannot open separate pull requests; Dependabot
# alerts remain enabled in the repository settings.
multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 1
updates:
  - package-ecosystem: gradle
    # The consumer build shares the root version catalog but pins its own settings plugins.
    directories:
      - /
      - /verification/consumer
    patterns:
      - '*'
    multi-ecosystem-group: dependencies
  - package-ecosystem: github-actions
    directory: /
    patterns:
      - '*'
    multi-ecosystem-group: dependencies
