name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      force_version:
        description: "Exact candidate version, e.g. 0.1.1 (required for publishing; otherwise optional)"
        required: false
        type: string
      candidate_commit:
        description: "Full commit SHA from the reviewed candidate summary (required for publishing)"
        required: false
        type: string
      publish:
        description: "Publish the verified candidate and tag it after public consumer verification"
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare and verify a release candidate
    runs-on: macos-26
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    outputs:
      release: ${{ steps.version.outputs.release }}
      version: ${{ steps.version.outputs.tag }}
      commit: ${{ steps.source.outputs.sha }}
    steps:
      - name: Checkout the candidate commit
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Record the candidate commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Require successful CI before publishing
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.source.outputs.sha }}
          REVIEWED_SHA: ${{ inputs.candidate_commit }}
          REVIEWED_VERSION: ${{ inputs.force_version }}
        run: |
          set -euo pipefail
          if [ "$REVIEWED_SHA" != "$RELEASE_SHA" ] || [ -z "$REVIEWED_VERSION" ]; then
            echo "Publishing requires the reviewed candidate's exact version and current main commit SHA." >&2
            exit 1
          fi
          passed="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$RELEASE_SHA&event=push&branch=main" --jq 'any(.workflow_runs[]; .conclusion == "success")')"
          if [ "$passed" != true ]; then
            echo "CI must succeed for $RELEASE_SHA before publishing." >&2
            exit 1
          fi

      - name: Compute next version
        id: version
        env:
          FORCE_VERSION: ${{ github.event.inputs.force_version }}
        run: |
          set -euo pipefail

          # Only consider bare SemVer tags (no "v" prefix).
          latest_tag="$(git tag --list --sort=-v:refname | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)"

          if [ -n "${FORCE_VERSION:-}" ]; then
            next="${FORCE_VERSION#v}"
            if ! [[ "$next" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "force_version must be a stable SemVer version (for example 0.2.0)." >&2
              exit 1
            fi
            if git rev-parse --verify --quiet "refs/tags/${next}"; then
              echo "Version ${next} already has a tag; nothing to publish."
              echo "release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Forcing version $next"
            echo "tag=$next" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # First release — bootstrap at 0.1.0.
          if [ -z "$latest_tag" ]; then
            echo "No existing tags; bootstrapping 0.1.0"
            echo "tag=0.1.0" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Latest tag: $latest_tag"
          major="${latest_tag%%.*}"
          rest="${latest_tag#*.}"
          minor="${rest%%.*}"
          patch="${rest#*.}"

          range="${latest_tag}..HEAD"
          subjects="$(git log "$range" --format='%s')"
          bodies="$(git log "$range" --format='%B')"
          if [ -z "$subjects" ]; then
            echo "No commits since $latest_tag; nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          breaking=false; feat=false; fix=false
          if echo "$subjects" | grep -Eq '^[a-zA-Z]+(\([^)]+\))?!:'; then breaking=true; fi
          if echo "$bodies" | grep -Eq 'BREAKING[ -]CHANGE'; then breaking=true; fi
          if echo "$subjects" | grep -Eq '^feat(\([^)]+\))?!?:'; then feat=true; fi
          if echo "$subjects" | grep -Eq '^(fix|perf)(\([^)]+\))?!?:'; then fix=true; fi

          if [ "$major" -eq 0 ]; then
            if [ "$breaking" = true ] || [ "$feat" = true ]; then bump="minor"
            elif [ "$fix" = true ]; then bump="patch"
            else bump="none"
            fi
          else
            if [ "$breaking" = true ]; then bump="major"
            elif [ "$feat" = true ]; then bump="minor"
            elif [ "$fix" = true ]; then bump="patch"
            else bump="none"
            fi
          fi

          case "$bump" in
            major) next="$((major + 1)).0.0" ;;
            minor) next="${major}.$((minor + 1)).0" ;;
            patch) next="${major}.${minor}.$((patch + 1))" ;;
            none)
              echo "Only non-releasing commits since $latest_tag; nothing to release."
              echo "release=false" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac

          echo "Bump: $bump -> $next"
          echo "tag=$next" >> "$GITHUB_OUTPUT"
          echo "release=true" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        if: steps.version.outputs.release == 'true'
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        if: steps.version.outputs.release == 'true'
        uses: gradle/actions/setup-gradle@v6.4.0

      - name: Stage and verify the release candidate
        if: steps.version.outputs.release == 'true'
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.tag }}
        run: |
          ./gradlew stageRelease -PVERSION_NAME="$RELEASE_VERSION" -PRELEASE_SIGNING_ENABLED=false --no-configuration-cache
          python3 Scripts/verify-release-artifacts.py --version "$RELEASE_VERSION" --staging-repository build/release-staging --manifest build/release-manifest.json
          ./gradlew -p verification/consumer verifyConsumer -PtestCommonsVersion="$RELEASE_VERSION" -PtestCommonsRepository="$GITHUB_WORKSPACE/build/release-staging"

      - name: Describe the prepared candidate
        if: steps.version.outputs.release == 'true'
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.tag }}
          RELEASE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          {
            echo "Candidate $RELEASE_VERSION from $RELEASE_SHA passed independent Maven consumer verification."
            echo "Publishing requires a manual Release run on main with the publish input selected."
            echo "A GitHub tag is created only after the public Maven Central consumer also passes."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload publication manifest
        if: steps.version.outputs.release == 'true'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-manifest
          path: build/release-manifest.json
          if-no-files-found: error

      - name: Upload candidate and verification evidence
        if: always() && steps.version.outputs.release == 'true'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-candidate
          path: |
            build/release-staging/**
            verification/consumer/**/build/reports/**

  publish:
    name: Publish the reviewed candidate
    needs: prepare
    if: github.event_name == 'workflow_dispatch' && inputs.publish && needs.prepare.outputs.release == 'true'
    runs-on: macos-26
    environment: secrets
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}

      - name: Require publishing credentials
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          SIGNING_IN_MEMORY_KEY: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
        run: |
          set -euo pipefail
          missing=false
          for name in MAVEN_CENTRAL_USERNAME MAVEN_CENTRAL_PASSWORD SIGNING_IN_MEMORY_KEY; do
            if [ -z "${!name}" ]; then
              echo "Missing GitHub Actions secret: $name" >&2
              missing=true
            fi
          done
          if [ "$missing" = true ]; then exit 1; fi

      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6.4.0

      - name: Publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_VERSION_NAME: ${{ needs.prepare.outputs.version }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
        run: ./gradlew publishAndReleaseToMavenCentral --no-configuration-cache

  verify:
    name: Verify public downloads and consumers
    needs: [prepare, publish]
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6.4.0
      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-manifest
          path: build

      - name: Wait for the publication and verify consumers
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          python3 Scripts/verify-release-artifacts.py --version "$RELEASE_VERSION" --manifest build/release-manifest.json
          ./gradlew -p verification/consumer verifyConsumer -PtestCommonsVersion="$RELEASE_VERSION" --refresh-dependencies --rerun-tasks

      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: public-consumer-reports
          path: verification/consumer/**/build/reports/**

  tag:
    name: Tag the verified publication
    needs: [prepare, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0

      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.version }}
          RELEASE_SHA: ${{ needs.prepare.outputs.commit }}
        run: |
          set -euo pipefail
          if git rev-parse --verify --quiet "refs/tags/$TAG"; then
            if [ "$(git rev-list -n 1 "$TAG")" != "$RELEASE_SHA" ]; then
              echo "Existing tag $TAG points at a different commit." >&2
              exit 1
            fi
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "$TAG"
            git push origin "$TAG"
          fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
