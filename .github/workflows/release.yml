name: Release

# release-please keeps a release PR open on main. Merging that PR is the decision to release: after
# CI passes on main, this workflow publishes the merged version to Maven Central, verifies public
# consumers, and only then lets release-please create the bare SemVer tag and GitHub Release.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-pr:
    name: Open or update the release PR
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Require the release-please token
        env:
          RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_PLEASE_TOKEN" ]; then
            echo "Missing GitHub Actions secret: RELEASE_PLEASE_TOKEN" >&2
            exit 1
          fi

      # A PAT, not GITHUB_TOKEN, so CI runs on the release PR. While a merged release PR is still
      # untagged, release-please leaves the PR alone until the tag job below finishes.
      - uses: googleapis/release-please-action@v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          target-branch: main
          skip-github-release: true

  prepare:
    name: Prepare and verify the release candidate
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: macos-26
    outputs:
      release: ${{ steps.version.outputs.release }}
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      # The release commit is the merged release PR, the last first-parent commit that changed the
      # manifest. Later commits on main never ride along with the version that was reviewed.
      - name: Find an unreleased version
        id: version
        run: |
          set -euo pipefail
          version="$(python3 -c 'import json; print(json.load(open(".release-please-manifest.json"))["."])')"
          if ! [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "The manifest version must be bare SemVer, found '$version'." >&2
            exit 1
          fi
          if git rev-parse --verify --quiet "refs/tags/$version" >/dev/null; then
            echo "Version $version is already tagged; nothing to publish."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          commit="$(git log -1 --first-parent --format=%H -- .release-please-manifest.json)"
          echo "Version $version from release commit $commit is unpublished."
          {
            echo "release=true"
            echo "version=$version"
            echo "commit=$commit"
          } >> "$GITHUB_OUTPUT"

      - name: Require successful CI for the release commit
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.version.outputs.commit }}
        run: |
          set -euo pipefail
          passed="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$RELEASE_SHA&event=push&branch=main" --jq 'any(.workflow_runs[]; .conclusion == "success")')"
          if [ "$passed" != true ]; then
            echo "CI must succeed on main for release commit $RELEASE_SHA before publishing." >&2
            exit 1
          fi

      - name: Check out the release commit
        if: steps.version.outputs.release == 'true'
        run: git checkout --detach "${{ steps.version.outputs.commit }}"

      - name: Set up Java
        if: steps.version.outputs.release == 'true'
        uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        if: steps.version.outputs.release == 'true'
        uses: gradle/actions/setup-gradle@v6.4.1

      - name: Stage and verify the release candidate
        if: steps.version.outputs.release == 'true'
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          ./gradlew stageRelease -PVERSION_NAME="$RELEASE_VERSION" -PRELEASE_SIGNING_ENABLED=false --no-configuration-cache
          python3 Scripts/verify-release-artifacts.py --version "$RELEASE_VERSION" --staging-repository build/release-staging --manifest build/release-manifest.json
          ./gradlew -p verification/consumer verifyConsumer -PtestCommonsVersion="$RELEASE_VERSION" -PtestCommonsRepository="$GITHUB_WORKSPACE/build/release-staging"

      - name: Upload publication manifest
        if: steps.version.outputs.release == 'true'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-manifest
          path: build/release-manifest.json
          if-no-files-found: error

      - name: Upload candidate and verification evidence
        if: always() && steps.version.outputs.release == 'true'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-candidate
          path: |
            build/release-staging/**
            verification/consumer/**/build/reports/**

  publish:
    name: Publish to Maven Central
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    runs-on: macos-26
    environment: secrets
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}

      - name: Require publishing credentials
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          SIGNING_IN_MEMORY_KEY: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
        run: |
          set -euo pipefail
          missing=false
          for name in MAVEN_CENTRAL_USERNAME MAVEN_CENTRAL_PASSWORD SIGNING_IN_MEMORY_KEY; do
            if [ -z "${!name}" ]; then
              echo "Missing GitHub Actions secret: $name" >&2
              missing=true
            fi
          done
          if [ "$missing" = true ]; then exit 1; fi

      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6.4.1

      - name: Publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_VERSION_NAME: ${{ needs.prepare.outputs.version }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
        run: ./gradlew publishAndReleaseToMavenCentral --no-configuration-cache

  verify:
    name: Verify public downloads and consumers
    needs: [prepare, publish]
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6.4.1
      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-manifest
          path: build

      - name: Wait for the publication and verify consumers
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          python3 Scripts/verify-release-artifacts.py --version "$RELEASE_VERSION" --manifest build/release-manifest.json
          ./gradlew -p verification/consumer verifyConsumer -PtestCommonsVersion="$RELEASE_VERSION" --refresh-dependencies --rerun-tasks

      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: public-consumer-reports
          path: verification/consumer/**/build/reports/**

  tag:
    name: Tag the verified publication
    needs: [prepare, verify]
    runs-on: ubuntu-latest
    steps:
      # Tags the merged release PR, creates its GitHub Release from the PR's notes, marks the PR
      # tagged, and then opens the next release PR if releasable commits are already waiting.
      - uses: googleapis/release-please-action@v5.0.0
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          target-branch: main

      - name: Require the tag on the published commit
        env:
          TAG: ${{ needs.prepare.outputs.version }}
          RELEASE_SHA: ${{ needs.prepare.outputs.commit }}
        run: |
          set -euo pipefail
          tagged="$(git ls-remote "https://github.com/$GITHUB_REPOSITORY.git" "refs/tags/$TAG^{}" "refs/tags/$TAG" | awk 'END { print $1 }')"
          if [ "$tagged" != "$RELEASE_SHA" ]; then
            echo "Tag $TAG points at '${tagged:-nothing}', expected the published commit $RELEASE_SHA." >&2
            exit 1
          fi
          echo "Tag $TAG points at $RELEASE_SHA."
