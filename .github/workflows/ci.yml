name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded runs on PR branches, but never on main: a cancelled main run reports
  # conclusion != success, which would skip the post-CI release workflow and stall a release.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  verify:
    # macOS runs the iOS simulator tests of the multiplatform modules.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          # Keep in sync with release.yml and gradle/gradle-daemon-jvm.properties.
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6.4.0

      # Tests on every target, ktlint, the public API check, and per-module coverage floors.
      - name: Check
        run: ./gradlew check koverXmlReport dokkaGenerate :samples:android:assembleDebug :samples:android:assembleDebugAndroidTest

      - name: Test release verification
        run: python3 -m unittest discover -s Scripts/tests -p 'test_*.py'

      - name: Verify an independently resolved release candidate
        env:
          CANDIDATE_VERSION: 0.0.0-verification-${{ github.sha }}
        run: |
          ./gradlew stageRelease -PVERSION_NAME="$CANDIDATE_VERSION" -PRELEASE_SIGNING_ENABLED=false --no-configuration-cache
          python3 Scripts/verify-release-artifacts.py --version "$CANDIDATE_VERSION" --staging-repository build/release-staging --manifest build/release-manifest.json
          ./gradlew -p verification/consumer verifyConsumer -PtestCommonsVersion="$CANDIDATE_VERSION" -PtestCommonsRepository="$GITHUB_WORKSPACE/build/release-staging"

      - name: Changed-line coverage
        if: github.event_name == 'pull_request'
        run: python3 Scripts/check-coverage.py --diff-base origin/${{ github.base_ref }}

      - name: Upload API docs for Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: docs-site
          path: build/dokka/html/
          if-no-files-found: error

      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: reports
          path: '**/build/reports/**'

  device:
    # UiAutomator and Espresso helpers need a real device; run them on an emulator.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6.4.0
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instrumented tests
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            ./gradlew :device:connectedAndroidDeviceTest
            ./gradlew :samples:android:connectedDebugAndroidTest
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: device-reports
          path: |
            device/build/reports/**
            device/build/outputs/androidTest-results/**
            samples/android/build/reports/**
            samples/android/build/outputs/androidTest-results/**
